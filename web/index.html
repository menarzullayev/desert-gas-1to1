<!doctype html>
<html lang="uz">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Gas — 100% kod</title>
<style>
:root { --bg: #150d1c; --ink: #f6e6ee; --mute: #b99bb0; --line: #3c2745; --accent: #74e2f2; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; min-height: 100dvh; display: grid; grid-template: auto 1fr auto / minmax(0, 1fr); }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 18px clamp(16px, 4vw, 40px); }
h1 { font-size: 1.5rem; letter-spacing: -.03em; margin: 0; }
a { color: var(--accent); }
main { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 0 16px; min-height: 0; }
.view { position: relative; height: min(70dvh, 1280px); aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; background: #241530; max-width: 100%; touch-action: pan-y; cursor: ew-resize; }
.view.auto { cursor: default; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
.view span { position: absolute; left: 12px; top: 10px; font-size: .875rem; background: #150d1ccc; padding: 2px 10px; border-radius: 8px; }
#ref[hidden] { display: none; }
footer { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: center; padding: 16px clamp(16px, 4vw, 40px) 22px; }
label { display: flex; gap: 10px; align-items: center; color: var(--mute); }
input[type=range] { width: min(380px, 48vw); min-width: 0; accent-color: var(--accent); height: 32px; }
button, .file { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 8px 16px; cursor: pointer; transition: border-color 180ms cubic-bezier(.22,1,.36,1); }
button:hover, .file:hover { border-color: var(--accent); }
button:focus-visible, .file:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
output { font-variant-numeric: tabular-nums; min-width: 4.2em; color: var(--mute); }
@media (max-width: 640px) { main { overflow-x: auto; justify-content: flex-start; } .view { height: auto; width: 100%; flex: 0 0 auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<header><h1>Desert Gas</h1><a href="https://github.com/menarzullayev/desert-gas-1to1">Manba kodi</a></header>
<main>
  <div class="view auto" id="ours"><video id="v" src="scrub.mp4" muted playsinline preload="auto"></video></div>
  <div class="view auto" id="ref" hidden><video id="r" muted playsinline preload="auto"></video><span>Solishtirma</span></div>
</main>
<footer>
  <button id="play">To'xtatish</button>
  <button id="snd" aria-pressed="false">Ovozni yoqish</button>
  <label>Kamera <input id="pos" type="range" min="0" max="1" step="0.001" value="0" aria-label="Kamera holati"><output id="t">0.0 s</output></label>
  <label class="file">Solishtirish uchun video tanlash<input id="f" type="file" accept="video/*"></label>
</footer>
<audio id="a" src="music.m4a" loop preload="auto"></audio>
<script>
const $ = (i) => document.getElementById(i), v = $('v'), r = $('r'), a = $('a'), pos = $('pos'), FPS = 60;
let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, want = null;
const len = () => (v.duration || 11) - 1 / FPS, hasRef = () => !$('ref').hidden;
function ui() { $('play').textContent = playing ? "To'xtatish" : 'Ijro etish'; for (const id of ['ours', 'ref']) $(id).classList.toggle('auto', playing); }
function set(p) { p = Math.min(1, Math.max(0, p)); pos.value = p; $('t').textContent = (p * len()).toFixed(1) + ' s'; want = p; pump(); }
function pump() { if (want === null || v.seeking) return; const p = want; want = null; v.currentTime = p * len(); if (hasRef() && r.duration) r.currentTime = p * (r.duration - 0.04); }
v.addEventListener('seeked', pump);
function go(on) { playing = on; ui(); if (on) { if (v.currentTime > len() - 0.05) v.currentTime = 0; v.play().catch(() => { playing = false; ui(); }); if (hasRef()) { r.currentTime = Math.min(v.currentTime, r.duration || 0); r.play().catch(() => {}); } if (snd) { a.currentTime = v.currentTime; a.play().catch(() => {}); } } else { v.pause(); r.pause(); a.pause(); } }
v.addEventListener('ended', () => { v.currentTime = 0; go(true); });
(function tick() { if (playing && v.duration) { pos.value = v.currentTime / len(); $('t').textContent = v.currentTime.toFixed(1) + ' s'; if (hasRef() && r.readyState > 1 && Math.abs(r.currentTime - v.currentTime) > 0.12 && v.currentTime < r.duration) r.currentTime = v.currentTime; } requestAnimationFrame(tick); })();
pos.addEventListener('input', () => { if (playing) go(false); set(+pos.value); });
$('play').onclick = () => go(!playing);
let snd = false; $('snd').onclick = () => { snd = !snd; $('snd').setAttribute('aria-pressed', snd); $('snd').textContent = snd ? "Ovozni o'chirish" : 'Ovozni yoqish'; if (snd && playing) { a.currentTime = v.currentTime; a.play(); } else a.pause(); };
for (const id of ['ours', 'ref']) { let x0 = null, p0 = 0; $(id).addEventListener('pointerdown', (e) => { if (playing) go(false); x0 = e.clientX; p0 = v.currentTime / len(); $(id).setPointerCapture(e.pointerId); }); $(id).addEventListener('pointermove', (e) => { if (x0 !== null) set(p0 + (e.clientX - x0) / $(id).clientWidth); }); $(id).addEventListener('pointerup', () => (x0 = null)); }
$('f').onchange = (e) => { const q = e.target.files[0]; if (!q) return; r.src = URL.createObjectURL(q); $('ref').hidden = false; r.onloadeddata = () => (playing ? go(true) : set(+pos.value)); };
ui(); v.addEventListener('loadeddata', () => playing && go(true), { once: true });
</script>
</html>
